# Nginx reverzný proxy pre TBAU portál.
# Primárna doména: portal.tbau.eu; tbau.goodvision.sk ostáva ako záloha.
# SSL riadky dopĺňa certbot:
#   sudo certbot --nginx -d portal.tbau.eu -d tbau.goodvision.sk -d www.tbau.goodvision.sk --expand --redirect

server {
    server_name portal.tbau.eu tbau.goodvision.sk www.tbau.goodvision.sk;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tbau.goodvision.sk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tbau.goodvision.sk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name portal.tbau.eu tbau.goodvision.sk www.tbau.goodvision.sk;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
