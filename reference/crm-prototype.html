:root{

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100%}
.side{background:var(--nav);color:var(--nav-ink);padding:20px 0;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand{font-family:var(--font-d);font-weight:700;font-size:24px;color:#fff;padding:0 20px 18px;letter-spacing:.5px}
.grp{font-size:12px;font-weight:600;letter-spacing:1px;padding:14px 20px 6px;color:#8FA2AE;text-transform:uppercase}
.nv{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--nav-ink);text-align:left;padding:10px 20px;cursor:pointer;font-size:15px;min-height:44px}
.nv:hover{background:var(--nav-on)}
.nv.on{background:var(--nav-on);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #F59E0B}
.nv .n{font-size:12px;background:#3A4E5B;color:#fff;border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.nv.off{opacity:.6}
.main{padding:24px 32px 48px;display:flex;flex-direction:column;gap:18px;min-width:0}
.demo{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:8px 12px}
h1{font-family:var(--font-d);font-size:32px;line-height:1.1;margin:0;font-weight:700;text-wrap:balance}
h2{font-family:var(--font-d);font-size:21px;margin:0;font-weight:700}
.sub{color:var(--muted)}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--ink);background:var(--surface);cursor:pointer;font-weight:600}
.btn:hover{background:var(--bg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}

.lnk{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:2px}
.inp{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;width:100%}
textarea.inp{padding:10px 12px;min-height:72px}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;cursor:pointer;color:inherit}
.kpi:hover{border-color:var(--muted)}
.kpi b{display:block;font-family:var(--font-d);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;font-weight:600;color:var(--muted)}

.tw{overflow-x:auto}

th{font-size:13px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.c-blue{background:var(--blue-bg);color:var(--blue-fg)}.c-amber{background:var(--amber-bg);color:var(--amber-fg)}.c-green{background:var(--green-bg);color:var(--green-fg)}

.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);min-height:44px}
.tab.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -3px 0 var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px 22px}
.k{font-size:13px;color:var(--muted);font-weight:600}.v{margin-top:2px}
.next{border-left:4px solid var(--accent)}
.list>div{padding:10px 0;border-bottom:1px solid var(--line)}.list>div:last-child{border-bottom:0}
.bar{height:8px;border-radius:4px;background:var(--grey-bg);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--green-fg)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.kcol{background:var(--grey-bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:200px}
.kcol h3{margin:2px 4px;font-size:14px;color:var(--grey-fg)}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
.stp{display:inline-flex;align-items:center;gap:6px}
.stp button{width:32px;height:32px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stp output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;max-width:92vw;z-index:9}
.warn{background:var(--amber-bg);color:var(--amber-fg);border-radius:8px;padding:10px 12px;font-size:14px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.form .full{grid-column:1/-1}
.empty{color:var(--muted);padding:16px 4px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;display:flex;overflow-x:auto;padding:8px 8px;align-items:center;gap:2px}
  .brand,.grp{display:none}.nv{width:auto;white-space:nowrap;padding:0 14px}.nv .n{margin-left:8px}
  .main{padding:16px}
  h1{font-size:27px}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
.chat{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow:auto;padding:4px 2px 12px}.msg{max-width:min(560px,92%);padding:8px 12px;border-radius:12px;background:var(--grey-bg);color:var(--grey-fg);overflow-wrap:anywhere}.msg.me{align-self:flex-end;background:var(--blue-bg);color:var(--blue-fg)}.msg small{display:block;font-size:12px;margin-bottom:2px}
</style>

function dt(iso){var p=iso.split('-');return new Date(+p[0],+p[1]-1,+p[2])}

function cust(id){return get('z',id)}
function stv(id){return get('s',id)}
function reqStav(r){if(r.zr)return ['Zrušená','c-grey'];if(r.pot>=r.req)return ['Naplnená','c-green'];if(r.pot>0)return ['Potvrdená','c-grey'];if(r.nav>0)return ['Navrhnutá','c-amber'];if(r.hl)return ['Hľadáme ľudí','c-red'];return ['Prijatá','c-blue']}
function nameOf(t,o){if(t==='u')return o.t;return t==='p'?o.prof+' · '+stv(o.sid).name:o.name}
function idLbl(t,o){return TPFX[t]+'-'+String(o.id).padStart(4,'0')}
function lnk(t,id){var o=get(t,id);return '<button class="lnk" data-ent="'+t+':'+id+'">'+esc(nameOf(t,o))+'</button>'}
function openT(o){return o.ul.filter(function(u){return !u.done}).sort(function(a,b){return a.due<b.due?-1:1})}
function allTasks(){var a=[];['z','s','p'].forEach(function(t){LIST[t].forEach(function(o){o.ul.forEach(function(u){if(!u.done)a.push({t:t,o:o,u:u})})})});return a.sort(function(a,b){return a.u.due<b.u.due?-1:1})}
function log(t,id,typ,txt){get(t,id).akt.unshift([TODAY,typ,txt])}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){e.hidden=true},3400)}
function openEnt(t,id,tab){S.view='karta';S.ent={t:t,id:id};S.tab=tab||'prehlad';S.pendEnd=null;render();window.scrollTo(0,0)}

function renderNav(){
  var over=allTasks().filter(function(x){return diff(x.u.due)<0}).length;
  var open=R.filter(function(r){return !r.zr&&r.pot<r.req}).length;
  var cur=S.view==='karta'?S.ent.t:'';
  var items=[['dnes','Dnes',over||''],['zakaznici','Zákazníci',''],['stavby','Stavby',''],['poziadavky','Požiadavky stavieb',open||''],['ulohy','Úlohy',''],['pipeline','Pipeline','']];
  var h='<div class="brand">TBAU 360</div><div class="grp">Obchod</div>';
  items.forEach(function(i){var on=S.view===i[0]||(i[0]==='zakaznici'&&cur==='z')||(i[0]==='stavby'&&cur==='s')||(i[0]==='poziadavky'&&cur==='p')||(i[0]==='ulohy'&&cur==='u');h+='<button class="nv'+(on?' on':'')+'" data-go="'+i[0]+'"'+(on?' aria-current="page"':'')+'>'+i[1]+(i[2]?'<span class="n">'+i[2]+'</span>':'')+'</button>'});
  h+='<div class="grp">Ostatné moduly</div>';
  ['Turnus','Smenovky','Fakturácia'].forEach(function(m){h+='<button class="nv off" data-off="'+m+'">'+m+'</button>'});
  document.getElementById('nav').innerHTML=h;
}

/* ---------- prehľady ---------- */
function vDnes(){
  var ts=allTasks(),today=ts.filter(function(x){return diff(x.u.due)===0}).length,over=ts.filter(function(x){return diff(x.u.due)<0}).length;
  var act=C.filter(function(c){return c.stav==='Aktívny'}).length,open=R.filter(function(r){return !r.zr&&r.pot<r.req});
  var h='<div class="head"><div><h1>Dnes</h1><div class="sub">Streda 7. októbra 2026 · '+OWNER+'</div></div><div class="row"><button class="btn pri" data-act="newopen">+ Nový zákazník</button></div></div>';
  h+='<div class="kpis"><button class="kpi" data-go="ulohy"><b>'+today+'</b><span>Úlohy dnes</span></button><button class="kpi bad" data-go="ulohy"><b>'+over+'</b><span>Po termíne</span></button><button class="kpi" data-go="zakaznici" data-fs="Aktívny"><b>'+act+'</b><span>Aktívni zákazníci</span></button><button class="kpi" data-go="poziadavky"><b>'+open.length+'</b><span>Otvorené požiadavky</span></button></div>';
  h+='<div class="cols"><div class="card main2"><h2>Moje úlohy</h2><div class="tw"><table><thead><tr><th>Termín</th><th>Úloha</th><th>Karta</th><th>Zodpovedný</th><th></th></tr></thead><tbody>';
  if(!ts.length)h+='<tr><td colspan="5" class="empty">Žiadne otvorené úlohy.</td></tr>';
  ts.forEach(function(x){h+='<tr><td>'+rel(x.u.due)+'</td><td>'+lnk('u',x.u.id)+'</td><td><span class="chip c-blue">'+TNAME[x.t]+'</span><div>'+lnk(x.t,x.o.id)+'</div></td><td>'+esc(x.u.who)+'</td><td><button class="btn sm" data-done="'+x.t+':'+x.o.id+':'+x.u.id+'">Hotovo</button></td></tr>'});
  h+='</tbody></table></div></div><div class="rail"><div class="card"><h2>Požiadavky na doplnenie</h2><div class="list">';
  open.slice(0,4).forEach(function(r){h+='<div>'+lnk('p',r.id)+'<div class="sub">'+esc(cust(r.cid).name)+' · žiadané '+r.req+' · navrhnuté '+r.nav+' · potvrdené '+r.pot+' · KW '+r.od+'</div></div>'});
  if(!open.length)h+='<div class="sub">Všetky požiadavky sú naplnené.</div>';
  h+='</div></div><div class="card"><h2>Zákazníci podľa stavu</h2><div class="row" style="margin-top:10px">';
  STAVY.forEach(function(s){var n=C.filter(function(c){return c.stav===s}).length;h+='<button class="chip '+STAV_CLS[s]+'" style="border:0;cursor:pointer;min-height:32px" data-go="zakaznici" data-fs="'+s+'">'+s+' '+n+'</button>'});
  return h+'</div></div></div></div>';
}
function newForm(){
  return '<form class="card" id="newForm"><h2>Nový zákazník</h2><div class="form" style="margin-top:12px"><div class="full"><label for="nn">Názov firmy</label><input class="inp" id="nn" required autocomplete="off"></div><div><label for="nk">Krajina</label><input class="inp" id="nk" value="Nemecko"></div><div><label for="no">Zodpovedný obchodník</label><select class="inp" id="no"><option>'+OWNER+'</option><option>Obchodník 2</option><option value="">(zatiaľ nikto)</option></select></div></div><div id="dupWarn"></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Uložiť zákazníka</button><button class="btn" type="button" data-act="newclose">Zrušiť</button></div></form>';
}
function listRows(){
  var q=S.q.trim().toLowerCase(),rows=C.filter(function(c){
    if(S.fStav&&c.stav!==S.fStav)return false;
    if(q){var hay=(c.name+' '+c.kontakty.map(function(k){return k[0]}).join(' ')).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true});
  if(!rows.length)return '<tr><td colspan="6" class="empty">Nič nenájdené. Skús iný text alebo stav.</td></tr>';
  return rows.map(function(c){var n=openT(c)[0];return '<tr class="click" data-ent="z:'+c.id+'"><td><button class="lnk" data-ent="z:'+c.id+'">'+esc(c.name)+'</button></td><td>'+chipStav(c.stav)+'</td><td>'+esc(c.owner||'—')+'</td><td>'+(n?esc(n.t)+'<div style="margin-top:4px">'+rel(n.due)+'</div>':'<span class="sub">bez úlohy</span>')+'</td><td>'+ST.filter(function(s){return s.cid===c.id}).length+'</td><td>'+R.filter(function(r){return r.cid===c.id&&!r.zr&&r.pot<r.req}).length+'</td></tr>'}).join('');
}
function vZakaznici(){
  var h='<div class="head"><div><h1>Zákazníci</h1><div class="sub">'+C.length+' firiem</div></div><button class="btn pri" data-act="newopen">+ Nový zákazník</button></div>';
  if(S.newOpen)h+=newForm();
  h+='<div class="row"><div style="flex:1 1 260px"><label for="q">Hľadať</label><input class="inp" id="q" placeholder="Názov firmy alebo kontakt" value="'+esc(S.q)+'" autocomplete="off"></div><div style="flex:0 1 220px"><label for="fs">Stav</label><select class="inp" id="fs"><option value="">Všetky</option>'+STAVY.map(function(s){return '<option'+(S.fStav===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div></div>';
  return h+'<div class="card tw" style="padding:6px 8px"><table><thead><tr><th>Firma</th><th>Stav</th><th>Obchodník</th><th>Najbližšia úloha</th><th>Stavby</th><th>Otvorené požiadavky</th></tr></thead><tbody id="rows">'+listRows()+'</tbody></table></div>';
}

/* ---------- spoločné časti kariet ---------- */
function histHtml(t,o){
  var h='<form class="card" id="actForm"><h2>Nový záznam do histórie</h2><div class="form" style="margin-top:12px"><div><label for="at">Typ</label><select class="inp" id="at"><option>Telefonát</option><option>E-mail</option><option>Návšteva</option><option>Stretnutie</option><option>Poznámka</option></select></div><div class="full"><label for="ad">Čo sa stalo alebo dohodlo</label><textarea class="inp" id="ad" required></textarea></div></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Uložiť záznam</button></div></form>';
  return h+'<div class="card"><h2>História aktivít</h2><div class="list" style="margin-top:8px">'+(o.akt.length?o.akt.map(actRow).join(''):'<div class="sub">Zatiaľ žiadny záznam.</div>')+'</div></div>';
}
function actRow(a){return '<div><b>'+fmt(a[0],true)+'</b> · <span class="chip c-grey">'+esc(a[1])+'</span><div style="margin-top:2px">'+esc(a[2])+'</div></div>'}
function tasksHtml(t,o){
  var op=openT(o),dn=o.ul.filter(function(u){return u.done});
  var h='<form class="card" id="taskForm"><h2>Nová úloha</h2><div class="form" style="margin-top:12px"><div class="full"><label for="tt">Čo treba urobiť</label><input class="inp" id="tt" required autocomplete="off"></div><div><label for="td">Termín</label><input class="inp" type="date" id="td" value="2026-10-14"></div><div><label for="tw">Zodpovedný</label><select class="inp" id="tw">'+WHO.map(function(w){return '<option>'+w+'</option>'}).join('')+'</select></div><div><label for="to">Oddelenie</label><select class="inp" id="to">'+ODD.map(function(w){return '<option'+(w===(t==='z'?'Obchod':'Koordinácia')?' selected':'')+'>'+w+'</option>'}).join('')+'</select></div></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Pridať úlohu</button></div></form>';
  h+='<div class="card"><h2>Otvorené úlohy</h2><div class="list" style="margin-top:8px">'+(op.length?op.map(function(u){return '<div class="row" style="justify-content:space-between"><div><b>'+lnk('u',u.id)+'</b><div class="sub">'+esc(u.who)+'</div></div><div class="row">'+rel(u.due)+'<button class="btn sm" data-done="'+t+':'+o.id+':'+u.id+'">Hotovo</button></div></div>'}).join(''):'<div class="sub">Žiadna otvorená úloha.</div>')+'</div></div>';
  if(dn.length)h+='<div class="card"><h2>Splnené</h2><div class="list" style="margin-top:8px">'+dn.map(function(u){return '<div class="sub"><s>'+esc(u.t)+'</s> · '+esc(u.who)+'</div>'}).join('')+'</div></div>';
  return h;
}
function docsHtml(t,o){
  var h='<form class="card" id="docForm"><h2>Pridať dokument</h2><div class="form" style="margin-top:12px"><div><label for="df">Súbor</label><input class="inp" type="file" id="df" style="padding-top:9px"></div><div><label for="dn">Alebo názov dokumentu</label><input class="inp" id="dn" autocomplete="off"></div><div><label for="dt">Typ</label><select class="inp" id="dt">'+DOKT.map(function(d){return '<option>'+d+'</option>'}).join('')+'</select></div></div><div class="sub" style="margin-top:8px;font-size:13px">V návrhu sa uloží len názov. V ostrej verzii sa súbor uloží do úložiska.</div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Pridať dokument</button></div></form>';
  return h+'<div class="card"><h2>Dokumenty</h2><div class="list" style="margin-top:8px">'+(o.dok.length?o.dok.map(function(d){return '<div><b>'+esc(d[0])+'</b><div class="sub"><span class="chip c-blue">'+esc(d[1])+'</span> · pridané '+fmt(d[2],true)+'</div></div>'}).join(''):'<div class="sub">Zatiaľ žiadny dokument.</div>')+'</div></div>';
}
function reqMini(r){var s=reqStav(r);return '<div>'+lnk('p',r.id)+' <span class="chip '+s[1]+'">'+s[0]+'</span><div class="sub">Žiadané '+r.req+' · navrhnuté '+r.nav+' · potvrdené '+r.pot+' · KW '+r.od+'–'+r.do+'</div></div>'}
function stvMini(s){return '<div>'+lnk('s',s.id)+' <span class="chip '+SS_CLS[s.stav]+'">'+s.stav+'</span><div class="sub">'+esc(s.adresa)+' · od KW '+s.od+'</div></div>'}
function nextBox(t,o){var n=openT(o)[0];
  if(n)return '<div class="card next"><div class="k">Najbližšia úloha</div><div style="font-size:17px;font-weight:600;margin:4px 0 8px">'+esc(n.t)+'</div>'+rel(n.due)+' <span class="sub">'+esc(n.who)+'</span><div class="row" style="margin-top:12px"><button class="btn sm" data-done="'+t+':'+o.id+':'+n.id+'">Hotovo</button><button class="btn sm" data-tab="ulohy">Všetky úlohy</button></div></div>';
  return '<div class="card next"><div class="k">Najbližšia úloha</div><div style="margin:4px 0 8px"><b>Chýba.</b> Pridaj úlohu s termínom, nech karta nezostane bez ďalšieho kroku.</div><button class="btn sm" data-tab="ulohy">Pridať úlohu</button></div>'}
function lastAct(o){return '<div class="card"><h2>Posledné aktivity</h2><div class="list" style="margin-top:8px">'+(o.akt.length?o.akt.slice(0,3).map(actRow).join(''):'<div class="sub">Zatiaľ žiadna aktivita.</div>')+'</div><button class="lnk" style="margin-top:8px" data-tab="historia">Celá história</button></div>'}

/* ---------- karta: hlavička a záložky ---------- */
function cardHead(t,o){
  var h='<div class="sub">';
  if(t==='z')h+='<button class="lnk" data-go="zakaznici">Zákazníci</button> / '+esc(o.name);
  if(t==='s')h+='<button class="lnk" data-go="stavby">Stavby</button> / '+lnk('z',o.cid)+' / '+esc(o.name);
  if(t==='p')h+='<button class="lnk" data-go="poziadavky">Požiadavky</button> / '+lnk('z',o.cid)+' / '+lnk('s',o.sid)+' / '+esc(o.prof);
  if(t==='u'){var pp=findTask(o.id);h+='<button class="lnk" data-go="ulohy">Úlohy</button> / '+TNAME[pp.t]+': '+lnk(pp.t,pp.o.id)+' / '+esc(o.t)}
  h+='</div>';
  var chip=t==='u'?'<span class="chip '+TST_CLS[o.st]+'">'+o.st+'</span> <span class="chip c-blue">'+esc(o.odd)+'</span>':t==='z'?chipStav(o.stav):t==='s'?'<span class="chip '+SS_CLS[o.stav]+'">'+o.stav+'</span>':'<span class="chip '+reqStav(o)[1]+'">'+reqStav(o)[0]+'</span>';
  var title=t==='p'?o.prof+' · '+esc(stv(o.sid).name):t==='u'?esc(o.t):esc(o.name);
  h+='<div class="head"><div class="row"><h1>'+(t==='p'?esc(o.prof)+' · '+esc(stv(o.sid).name):title)+'</h1>'+chip+'<span class="sub">'+TNAME[t]+' · '+idLbl(t,o)+'</span></div>';
  if(t==='z')h+='<div class="row"><label for="stavSel" style="margin:0">Stav</label><select class="inp" id="stavSel" style="width:auto">'+STAVY.map(function(s){return '<option'+(o.stav===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>';
  if(t==='s')h+='<div class="row"><label for="stavbaSel" style="margin:0">Stav stavby</label><select class="inp" id="stavbaSel" style="width:auto">'+SS.map(function(s){return '<option'+(o.stav===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>';
  if(t==='u')h+='<div class="row"><label for="ustSel" style="margin:0">Stav úlohy</label><select class="inp" id="ustSel" style="width:auto">'+TST.map(function(s){return '<option'+(o.st===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div>';
  if(t==='p'&&!o.zr)h+='<div class="row">'+(o.nav===0&&!o.hl?'<button class="btn sm" data-rq="hl" data-id="'+o.id+'">Začať hľadať ľudí</button>':'')+'<button class="btn sm" data-rq="zr" data-id="'+o.id+'">Zrušiť požiadavku</button></div>';
  return h+'</div>';
}
function tabsFor(t,o){
  var l=[['prehlad','Prehľad']];
  if(t==='z')l.push(['podmienky','Podmienky'],['kontakty','Kontakty '+o.kontakty.length],['stavby','Stavby '+ST.filter(function(s){return s.cid===o.id}).length],['poziadavky','Požiadavky '+R.filter(function(r){return r.cid===o.id}).length]);
  if(t==='s')l.push(['poziadavky','Požiadavky '+R.filter(function(r){return r.sid===o.id}).length]);
  if(t!=='u')l.push(['ulohy','Úlohy '+openT(o).length]);l.push(['dokumenty','Dokumenty '+o.dok.length],['chat','Chat '+(o.chat||[]).length],['historia','História aktivít '+o.akt.length]);
  return '<div class="tabs" role="tablist">'+l.map(function(x){return '<button class="tab'+(S.tab===x[0]?' on':'')+'" role="tab" aria-selected="'+(S.tab===x[0])+'" data-tab="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
}
function infoGrid(rows){return '<div class="grid">'+rows.map(function(p){return '<div><div class="k">'+p[0]+'</div><div class="v">'+(p[2]?p[1]:(esc(p[1])||'<span class="sub">nevyplnené</span>'))+'</div></div>'}).join('')+'</div>'}
function rqForm(sid){
  var s=stv(sid);
  return '<form class="card" id="rqForm"><h2>Nová požiadavka</h2><div class="sub">Zákazník: '+esc(cust(s.cid).name)+' · stavba: '+esc(s.name)+'</div><div class="form" style="margin-top:12px"><div><label for="rp">Profesia</label><input class="inp" id="rp" required></div><div><label for="rn">Počet ľudí</label><input class="inp" id="rn" type="number" min="1" value="2" required></div><div><label for="r1">KW od</label><input class="inp" id="r1" type="number" min="1" max="53" value="'+Math.max(s.od,46)+'" required></div><div><label for="r2">KW do</label><input class="inp" id="r2" type="number" min="1" max="53" value="'+Math.max(s.do,50)+'" required></div><div><label for="rk">Kto požiadal</label><input class="inp" id="rk" value="'+esc(s.bauleiter)+'"></div><div class="full"><label for="rm">Podmienky</label><input class="inp" id="rm" placeholder="Napr. dvojice, doklady, ubytovanie"></div></div><input type="hidden" id="rsid" value="'+s.id+'"><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Uložiť požiadavku</button></div></form>';
}

function vKarta(){
  var t=S.ent.t,o=get(t,S.ent.id);if(!o)return vDnes();
  var h=cardHead(t,o);
  if(t==='z'&&S.pendEnd===o.id)h+='<div class="card" style="border-color:var(--accent)"><h2>Dôvod ukončenia spolupráce</h2><div class="row" style="margin-top:10px"><select class="inp" id="dovod" style="max-width:280px">'+DOVODY.map(function(d){return '<option>'+d+'</option>'}).join('')+'</select><button class="btn pri" data-act="endok">Ukončiť spoluprácu</button><button class="btn" data-act="endno">Zrušiť</button></div><div class="sub" style="margin-top:8px">Stav Ukončený vyžaduje dôvod. Zapíše sa do hodnotenia zákazníka.</div></div>';
  if(t==='z'&&o.stav==='Ukončený'&&o.dovod)h+='<div class="warn">Spolupráca ukončená. Dôvod: '+esc(o.dovod)+'.</div>';
  h+=tabsFor(t,o);
  var tab=S.tab;
  if(tab==='ulohy')return h+tasksHtml(t,o);
  if(tab==='dokumenty')return h+docsHtml(t,o);
  if(tab==='historia')return h+histHtml(t,o);
  if(tab==='chat')return h+chatHtml(o);
  if(t==='u')return h+taskOverview(o);
  if(t==='z'){

function allT(){var a=[];['z','s','p'].forEach(function(t){LIST[t].forEach(function(o){o.ul.forEach(function(u){a.push({t:t,o:o,u:u})})})});return a.sort(function(a,b){return a.u.due<b.u.due?-1:1})}
function findTask(id){return allT().filter(function(x){return x.u.id===id})[0]}
function bucket(u){if(u.done)return 'Hotová';var n=diff(u.due);return n<0?'Po termíne':n===0?'Dnes':n<=4?'Tento týždeň':'Neskôr'}
function tFilt(){return allT().filter(function(x){return (!S.tfo||x.u.odd===S.tfo)&&(!S.tfw||x.u.who===S.tfw)})}
function tcols(){return S.tg==='stav'?TST:S.tg==='odd'?ODD:S.tg==='osoba'?WHO:BUCKETS.concat(S.tdone?['Hotová']:[])}
function colOf(u){return S.tg==='stav'?u.st:S.tg==='odd'?u.odd:S.tg==='osoba'?u.who:bucket(u)}
function applyCol(u,k){
  if(S.tg==='stav')setSt(u,k);else if(S.tg==='odd'){u.akt.unshift([TODAY,'Zmena oddelenia',u.odd+' → '+k]);u.odd=k}else if(S.tg==='osoba'){u.akt.unshift([TODAY,'Zmena osoby',u.who+' → '+k]);u.who=k}
  else{if(k==='Hotová')setSt(u,'Hotová');else{if(u.done)setSt(u,'Nová');u.akt.unshift([TODAY,'Zmena termínu',fmt(u.due)+' → '+fmt(BUCKET_DUE[k])]);u.due=BUCKET_DUE[k]}}
}
function dayLabel(n){var x=new Date(dt(TODAY).getTime()+n*864e5);return DAYS[x.getDay()]+' '+x.getDate()+'. '+(x.getMonth()+1)+'.'}

function kanban(cols){
  return '<div class="kan">'+cols.map(function(c){return '<div class="kcol"><h3>'+esc(c.title)+' · '+c.items.length+'</h3>'+(c.items.length?c.items.join(''):'<div class="sub" style="padding:6px 4px">Prázdne</div>')+'</div>'}).join('')+'</div>';
}
function moveBtns(attr,id,i,n){return '<div class="row" style="margin-top:8px;gap:6px">'+(i>0?'<button class="btn sm" data-'+attr+'="-1" data-id="'+id+'" aria-label="Presunúť späť">←</button>':'')+(i<n-1?'<button class="btn sm" data-'+attr+'="1" data-id="'+id+'" aria-label="Presunúť ďalej">→</button>':'')+'</div>'}

/* --- úlohy --- */
function taskCard(x,moves){var u=x.u,cols=tcols().map(function(c){return c}),i=cols.indexOf(colOf(u));
  return '<div class="kc"><div style="font-weight:600">'+lnk('u',u.id)+'</div><div class="row" style="gap:6px;margin:6px 0">'+(u.done?'<span class="chip c-green">Hotová</span>':rel(u.due))+'<span class="chip c-blue">'+esc(u.odd)+'</span></div><div class="sub" style="font-size:13px">'+esc(u.who)+' · '+TNAME[x.t]+': '+lnk(x.t,x.o.id)+'</div>'+
  '<div class="row" style="gap:6px;margin-top:8px">'+(moves&&i>0?'<button class="btn sm" data-mvt="-1" data-id="'+u.id+'" aria-label="Presunúť späť">←</button>':'')+(moves&&i<cols.length-1?'<button class="btn sm" data-mvt="1" data-id="'+u.id+'" aria-label="Presunúť ďalej">→</button>':'')+'<button class="btn sm" data-te="'+u.id+'">Otvoriť</button></div></div>';
}
function taskControls(showGroup){
  return '<div class="row">'+(showGroup?'<div><label for="tg">Zoskupiť podľa</label><select class="inp" id="tg" style="width:auto"><option value="stav"'+(S.tg==='stav'?' selected':'')+'>Stav dokončenia</option><option value="odd"'+(S.tg==='odd'?' selected':'')+'>Oddelenia</option><option value="osoba"'+(S.tg==='osoba'?' selected':'')+'>Osoby</option><option value="termin"'+(S.tg==='termin'?' selected':'')+'>Termín dokončenia</option></select></div>':'')+
  '<div><label for="tfo">Oddelenie</label><select class="inp" id="tfo" style="width:auto"><option value="">Všetky</option>'+ODD.map(function(o){return '<option'+(S.tfo===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>'+
  '<div><label for="tfw">Osoba</label><select class="inp" id="tfw" style="width:auto"><option value="">Všetky</option>'+WHO.map(function(o){return '<option'+(S.tfw===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select></div>'+
  '<label style="display:flex;gap:8px;align-items:center;margin:20px 0 0;min-height:44px"><input type="checkbox" id="tshow"'+(S.tdone?' checked':'')+'> Zobraziť hotové</label></div>';
}
function taskKanban(){
  var items=tFilt().filter(function(x){return S.tdone||!x.u.done||S.tg==='stav'});
  var cols=tcols().map(function(k){return {title:k,items:items.filter(function(x){return colOf(x.u)===k}).map(function(x){return taskCard(x,true)})}});
  return '<div class="sub">Zoskupené podľa '+TG_LBL[S.tg]+'. Šípkami meníš '+({stav:'stav',odd:'oddelenie',osoba:'zodpovednú osobu',termin:'termín'})[S.tg]+' úlohy.</div>'+kanban(cols);
}
function taskList(){
  var rows=tFilt().filter(function(x){return S.tdone||!x.u.done});
  var h='<div class="card tw" style="padding:6px 8px"><table style="min-width:860px"><thead><tr><th>Termín</th><th>Úloha</th><th>Karta</th><th>Oddelenie</th><th>Zodpovedný</th><th>Stav</th><th></th></tr></thead><tbody>';
  if(!rows.length)h+='<tr><td colspan="7" class="empty">Žiadne úlohy v tomto filtri.</td></tr>';
  rows.forEach(function(x){var u=x.u;h+='<tr><td>'+(u.done?'<span class="sub">'+fmt(u.due)+'</span>':rel(u.due))+'</td><td>'+(u.done?'<s>'+lnk('u',u.id)+'</s>':lnk('u',u.id))+'</td><td><span class="chip c-grey">'+TNAME[x.t]+'</span><div>'+lnk(x.t,x.o.id)+'</div></td><td>'+esc(u.odd)+'</td><td>'+esc(u.who)+'</td><td><select class="inp tstsel" data-id="'+u.id+'" aria-label="Stav úlohy" style="min-height:36px;width:auto">'+TST.map(function(s){return '<option'+(u.st===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></td><td><button class="btn sm" data-te="'+u.id+'">Otvoriť</button></td></tr>'});
  return h+'</tbody></table></div>';
}
function taskCal(){
  var items=tFilt().filter(function(x){return !x.u.done}),cols=[{title:'Po termíne',items:[]}];
  for(var n=0;n<7;n++)cols.push({title:(n===0?'Dnes · ':'')+dayLabel(n),items:[]});
  cols.push({title:'Neskôr',items:[]});
  items.forEach(function(x){var n=diff(x.u.due),k=n<0?0:n>6?8:n+1;cols[k].items.push(taskCard(x,false))});
  return '<div class="sub">Týždenný pohľad od dnes. Termín meníš v úprave úlohy.</div>'+kanban(cols);
}
function taskPanel(){
  if(S.task==null)return '';var x=findTask(S.task);if(!x)return '';var u=x.u;
  return '<form class="card" id="taskEdit" style="border-color:var(--accent)"><h2>Úloha</h2><div class="sub">'+TNAME[x.t]+': '+lnk(x.t,x.o.id)+'</div><div class="form" style="margin-top:12px"><div class="full"><label for="te_t">Čo treba urobiť</label><input class="inp" id="te_t" required value="'+esc(u.t)+'"></div><div><label for="te_d">Termín</label><input class="inp" type="date" id="te_d" value="'+u.due+'"></div><div><label for="te_w">Zodpovedný</label><select class="inp" id="te_w">'+WHO.map(function(w){return '<option'+(u.who===w?' selected':'')+'>'+w+'</option>'}).join('')+'</select></div><div><label for="te_o">Oddelenie</label><select class="inp" id="te_o">'+ODD.map(function(w){return '<option'+(u.odd===w?' selected':'')+'>'+w+'</option>'}).join('')+'</select></div><div><label for="te_s">Stav</label><select class="inp" id="te_s">'+TST.map(function(w){return '<option'+(u.st===w?' selected':'')+'>'+w+'</option>'}).join('')+'</select></div></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Uložiť</button><button class="btn" type="button" data-tclose="1">Zavrieť</button><button class="btn" type="button" data-tdel="'+u.id+'">Odstrániť úlohu</button></div></form>';
}
function taskNewForm(){
  var opts='';[['z','Zákazníci'],['s','Stavby'],['p','Požiadavky']].forEach(function(g){opts+='<optgroup label="'+g[1]+'">'+LIST[g[0]].map(function(o){return '<option value="'+g[0]+':'+o.id+'">'+esc(nameOf(g[0],o))+'</option>'}).join('')+'</optgroup>'});
  return '<form class="card" id="taskNew"><h2>Nová úloha</h2><div class="form" style="margin-top:12px"><div class="full"><label for="nt_t">Čo treba urobiť</label><input class="inp" id="nt_t" required autocomplete="off"></div><div class="full"><label for="nt_e">Viaže sa na kartu</label><select class="inp" id="nt_e">'+opts+'</select></div><div><label for="nt_d">Termín</label><input class="inp" type="date" id="nt_d" value="2026-10-14"></div><div><label for="nt_w">Zodpovedný</label><select class="inp" id="nt_w">'+WHO.map(function(w){return '<option>'+w+'</option>'}).join('')+'</select></div><div><label for="nt_o">Oddelenie</label><select class="inp" id="nt_o">'+ODD.map(function(w){return '<option>'+w+'</option>'}).join('')+'</select></div></div><div class="row" style="margin-top:12px"><button class="btn pri" type="submit">Pridať úlohu</button><button class="btn" type="button" data-tnew="0">Zrušiť</button></div></form>';
}
function vUlohy(){
  var h='<div class="head"><div><h1>Úlohy</h1><div class="sub">Všetky úlohy zo všetkých kariet. Každá úloha patrí zákazníkovi, stavbe alebo požiadavke.</div></div><button class="btn pri" data-tnew="1">+ Nová úloha</button></div>';
  if(S.tnew)h+=taskNewForm();h+=taskPanel();
  h+='<div class="row">'+[['zoznam','Zoznam'],['kanban','Kanban'],['kalendar','Kalendár']].map(function(v){return '<button class="btn sm'+(S.uv===v[0]?' pri':'')+'" data-uv="'+v[0]+'" aria-pressed="'+(S.uv===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>';
  h+=taskControls(S.uv==='kanban');
  return h+(S.uv==='zoznam'?taskList():S.uv==='kanban'?taskKanban():taskCal());
}

/* --- pipeline --- */
function moveReq(r,dir){
  var cur=reqStav(r)[0],i=RP.indexOf(cur),j=i+dir;if(j<0||j>=RP.length)return;
  var tg=cur==='Zrušená'?'Prijatá':RP[j];
  rqChange(r,function(){
    r.zr=false;
    if(tg==='Prijatá'){r.hl=false;r.nav=0;r.pot=0}
    if(tg==='Hľadáme ľudí'){r.hl=true;r.nav=0;r.pot=0}
    if(tg==='Navrhnutá'){r.hl=true;r.nav=Math.max(1,Math.min(r.nav,r.req));r.pot=0}
    if(tg==='Potvrdená'){r.hl=true;r.pot=Math.max(0,Math.min(Math.max(1,r.pot),r.req-1));r.nav=Math.max(r.nav,r.pot,1)}
    if(tg==='Naplnená'){r.hl=true;r.nav=r.req;r.pot=r.req}
    if(tg==='Zrušená'){r.zr=true;log('s',r.sid,'Požiadavka zrušená',r.prof)}
  });
}
function vPipeline(){
  var tabs=[['z','Zákazníci'],['s','Stavby'],['p','Požiadavky'],['t','Úlohy']];
  var h='<div class="head"><div><h1>Pipeline</h1><div class="sub">Prehľad na tabuli. Šípkami presúvaš karty o stupeň, zmena sa zapíše do histórie karty.</div></div></div><div class="row">'+tabs.map(function(v){return '<button class="btn sm'+(S.pt===v[0]?' pri':'')+'" data-pt="'+v[0]+'" aria-pressed="'+(S.pt===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>';
  if(S.pt==='z'){
    h+=kanban(STAVY.map(function(s,i){return {title:s,items:C.filter(function(c){return c.stav===s}).map(function(c){var n=openT(c)[0];return '<div class="kc">'+lnk('z',c.id)+'<div class="sub" style="font-size:13px">'+(n?esc(n.t):'bez úlohy')+'</div>'+moveBtns('mv',c.id,i,STAVY.length)+'</div>'})}}));
  }else if(S.pt==='s'){
    h+=kanban(SS.map(function(s,i){return {title:s,items:ST.filter(function(x){return x.stav===s}).map(function(x){var n=R.filter(function(r){return r.sid===x.id&&!r.zr&&r.pot<r.req}).length;return '<div class="kc">'+lnk('s',x.id)+'<div class="sub" style="font-size:13px">'+esc(cust(x.cid).name)+'<br>KW '+x.od+'–'+x.do+' · ľudia '+x.ludia+(n?' · otvorené požiadavky '+n:'')+'</div>'+moveBtns('mvs',x.id,i,SS.length)+'</div>'})}}));
  }else if(S.pt==='p'){
    h+=kanban(RP.map(function(s,i){return {title:s,items:R.filter(function(r){return reqStav(r)[0]===s}).map(function(r){return '<div class="kc">'+lnk('p',r.id)+'<div class="sub" style="font-size:13px">'+esc(cust(r.cid).name)+'<br>Žiadané '+r.req+' · navrhnuté '+r.nav+' · potvrdené '+r.pot+' · KW '+r.od+'</div>'+moveBtns('mvp',r.id,i,RP.length)+'</div>'})}}));
  }else{
    h+=taskPanel()+taskControls(true)+taskKanban();
  }
  return h;
}

/* --- udalosti --- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-pt],[data-uv],[data-te],[data-tclose],[data-tdel],[data-tnew],[data-mvs],[data-mvp],[data-mvt]');if(!t)return;var d=t.dataset;
  if(d.pt){S.pt=d.pt;render();return}
  if(d.uv){S.uv=d.uv;render();return}
  if(d.te){openEnt('u',+d.te);return}
  if(d.tclose){S.task=null;render();return}
  if(d.tnew!==undefined){S.tnew=d.tnew==='1';render();return}
  if(d.tdel){var x=findTask(+d.tdel);if(x){x.o.ul=x.o.ul.filter(function(u){return u.id!==x.u.id});x.o.akt.unshift([TODAY,'Úloha odstránená',x.u.t])}S.task=null;if(S.view==='karta'&&S.ent.t==='u')S.view='ulohy';render();toast('Úloha odstránená.');return}
  if(d.mvs){var s=stv(+d.id),i=SS.indexOf(s.stav)+ +d.mvs;if(i<0||i>=SS.length)return;log('s',s.id,'Zmena stavu',s.stav+' → '+SS[i]);s.stav=SS[i];render();toast(s.name+': '+SS[i]);return}
  if(d.mvp){moveReq(get('p',+d.id),+d.mvp);render();return}
  if(d.mvt){var y=findTask(+d.id),cols=tcols(),k=cols.indexOf(colOf(y.u))+ +d.mvt;if(k<0||k>=cols.length)return;var was=y.u.done;applyCol(y.u,cols[k]);if(!was&&y.u.done)y.o.akt.unshift([TODAY,'Úloha splnená',y.u.t]);render();return}
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='tg'){S.tg=el.value;render()}
  if(el.id==='tfo'){S.tfo=el.value;render()}
  if(el.id==='tfw'){S.tfw=el.value;render()}
  if(el.id==='tshow'){S.tdone=el.checked;render()}
  if(el.classList&&el.classList.contains('tstsel')){var x=findTask(+el.dataset.id);var was=x.u.done;setSt(x.u,el.value);if(!was&&x.u.done)x.o.akt.unshift([TODAY,'Úloha splnená',x.u.t]);render()}
});
document.addEventListener('submit',function(e){
  var id=e.target.id;
  if(id==='taskNew'){e.preventDefault();var p=document.getElementById('nt_e').value.split(':'),o=get(p[0],+p[1]),tx=document.getElementById('nt_t').value.trim();if(!tx)return;o.ul.push(T(tx,document.getElementById('nt_d').value||'2026-10-14',document.getElementById('nt_w').value,false,document.getElementById('nt_o').value));o.akt.unshift([TODAY,'Nová úloha',tx]);S.tnew=false;render();toast('Úloha pridaná ku karte: '+nameOf(p[0],o)+'.')}
});

var CHATWHO=WHO.concat(['Administratíva']);

  var p=m.ts.split(' '),body=esc(m.txt).replace(/@(Obchodník \d|Koordinátor|Administratíva)/g,'<b>@$1</b>');

document.addEventListener('keydown',function(e){if(e.target.id==='cm'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('chatForm').requestSubmit()}});
